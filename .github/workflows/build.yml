# .github/workflows/build.yml
#
# CI for vtun (modern-Linux fork of VTun / vtund).
#
# Two independent purposes:
#   1. Smoke build on every push to main and every PR — catch FTBFS
#      regressions early (OpenSSL 3 / GCC 14 / autoconf breakage).
#   2. On a "v*" tag — build .deb packages for a matrix of Debian/Ubuntu
#      releases on amd64 + arm64, then attach every .deb to the Release.

name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  # ---------------------------------------------------------------------------
  # 1) Smoke build: ./configure && make on the hosted Ubuntu runner.
  #    Fast sanity check that the tree still compiles against current
  #    OpenSSL / GCC. Runs on push-to-main and on PRs (not strictly needed
  #    for tags, but harmless and cheap).
  # ---------------------------------------------------------------------------
  smoke-build:
    name: smoke build (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc make libssl-dev liblzo2-dev zlib1g-dev flex bison

      - name: configure && make
        run: |
          ./configure
          make

  # ---------------------------------------------------------------------------
  # 2) .deb matrix: only on tag pushes ("v*").
  #
  #    Strategy:
  #      - One job per (distro x arch) combination.
  #      - The distro is provided by a container image (debian:12/13,
  #        ubuntu:22.04/24.04) so we build against that release's exact
  #        toolchain + libssl, regardless of the host runner's OS.
  #      - arm64 is built NATIVELY on the "ubuntu-24.04-arm" hosted runner
  #        (simplest robust approach — no QEMU emulation, full speed, no
  #        binfmt setup). amd64 builds on the normal "ubuntu-latest" runner.
  #        The container image is pulled for the matching architecture
  #        automatically because each job runs on a host of that arch.
  # ---------------------------------------------------------------------------
  deb:
    name: deb ${{ matrix.image }} (${{ matrix.arch }})
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        image:
          - debian:12
          - debian:13
          - ubuntu:22.04
          - ubuntu:24.04
        arch: [amd64, arm64]
        include:
          # Map each arch to a host runner of that architecture so the
          # container (and thus the produced .deb) is the right ABI natively.
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      # The container images are minimal; install git (the checkout action falls
      # back to the git CLI), plus the toolchain, vtun's build-deps, and the
      # Debian packaging tools (debhelper provides dh; devscripts pulls in helpers).
      - name: Install build + packaging dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git ca-certificates \
            gcc make libssl-dev liblzo2-dev zlib1g-dev flex bison \
            debhelper devscripts build-essential

      - uses: actions/checkout@v6

      # debian/source/format is 3.0 (native); -b builds a binary-only
      # package; -us -uc skips GPG signing (no key in CI).
      - name: Build .deb (dpkg-buildpackage)
        # noautodbgsym: skip the separate -dbgsym package (not useful on a release).
        run: |
          DEB_BUILD_OPTIONS=noautodbgsym dpkg-buildpackage -us -uc -b

      # dpkg-buildpackage drops the artifacts in the PARENT directory. The .deb
      # filename does NOT encode the distro (e.g. vtun_3.0.4+fork1_amd64.deb is
      # produced on every distro), so without a distro tag the packages would
      # overwrite each other on the Release. Insert a distro slug before the arch.
      - name: Collect & rename .deb artifacts
        run: |
          mkdir -p artifacts
          slug="$(echo '${{ matrix.image }}' | tr ':.' '--')"   # debian:13 -> debian-13
          for f in ../vtun_*_*.deb; do
            stem="$(basename "$f" .deb)"        # vtun_3.0.4+fork1_amd64
            stem="${stem%_*}"                   # vtun_3.0.4+fork1
            mv "$f" "artifacts/${stem}_${slug}_${{ matrix.arch }}.deb"
          done
          ls -l artifacts

      - name: Compute artifact name
        id: name
        run: |
          safe="$(echo "${{ matrix.image }}" | tr ':' '-')"
          echo "value=deb-${safe}-${{ matrix.arch }}" >> "$GITHUB_OUTPUT"

      - name: Upload .deb as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.name.outputs.value }}
          path: artifacts/*.deb
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 3) Release: ONE job (after the whole matrix) collects every per-distro .deb
  #    artifact and attaches them to the GitHub Release in a single upload.
  #    Uploading from a single job avoids the race where parallel matrix jobs
  #    each try to create the same release (HTTP 422 "tag_name already_exists").
  # ---------------------------------------------------------------------------
  release:
    name: release
    needs: deb
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all .deb artifacts
        uses: actions/download-artifact@v8
        with:
          path: dl
          pattern: deb-*
          merge-multiple: true

      - name: List collected packages
        run: ls -lR dl

      - name: Attach .deb files to the GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dl/**/*.deb

  # ---------------------------------------------------------------------------
  # 4) APT repository on GitHub Pages (tags only). Publishes a GPG-signed,
  #    per-distro-suite apt repo so users can `apt update && apt install vtun`.
  #    Each distro codename (bookworm/trixie/jammy/noble) is an independent flat
  #    repo, so e.g. a Debian 12 box never pulls an Ubuntu 24.04 build.
  # ---------------------------------------------------------------------------
  apt-repo:
    name: apt repository (Pages)
    needs: deb
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6

      - name: Install repository tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dpkg-dev apt-utils gnupg

      - name: Download all .deb artifacts
        uses: actions/download-artifact@v8
        with:
          path: dl
          pattern: deb-*
          merge-multiple: true

      - name: Import the repository signing key
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          printf '%s' "$APT_GPG_PRIVATE_KEY" | gpg --batch --import
          echo "GPGKEY=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/{print $10; exit}')" >> "$GITHUB_ENV"

      - name: Build the signed APT repository
        run: |
          set -euo pipefail
          declare -A SUITE=(
            [debian-12]=bookworm
            [debian-13]=trixie
            [ubuntu-22-04]=jammy
            [ubuntu-24-04]=noble
          )
          mkdir -p _site
          cp repo-signing-key.asc _site/repo-signing-key.asc
          printf '%s\n' \
            '<!doctype html><meta charset=utf-8><title>vtun apt repository</title>' \
            '<h1>vtun &mdash; apt repository</h1>' \
            '<p>Signed APT repository for the OpenSSL 3 / Debian 13 fork of VTun.</p>' \
            '<p>Setup &amp; documentation: <a href="https://github.com/tostmann/vtun">github.com/tostmann/vtun</a></p>' \
            '<p>Suites: bookworm, trixie, jammy, noble (amd64, arm64).</p>' \
            > _site/index.html
          for slug in "${!SUITE[@]}"; do
            codename="${SUITE[$slug]}"
            d="_site/${codename}"
            mkdir -p "$d"
            cp dl/vtun_*_"${slug}"_*.deb "$d"/
            (
              cd "$d"
              dpkg-scanpackages -m . /dev/null > Packages
              gzip -9 -kf Packages
              apt-ftparchive \
                -o APT::FTPArchive::Release::Origin="vtun" \
                -o APT::FTPArchive::Release::Label="vtun (OpenSSL 3 fork)" \
                -o APT::FTPArchive::Release::Suite="${codename}" \
                -o APT::FTPArchive::Release::Codename="${codename}" \
                -o APT::FTPArchive::Release::Architectures="amd64 arm64" \
                -o APT::FTPArchive::Release::Components="main" \
                release . > "${RUNNER_TEMP}/Release" && mv "${RUNNER_TEMP}/Release" Release
              gpg --batch --yes --local-user "${GPGKEY}" --clearsign -o InRelease Release
              gpg --batch --yes --local-user "${GPGKEY}" --detach-sign --armor -o Release.gpg Release
            )
          done
          find _site -type f | sort

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
